<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超燃片段</title>
    <link rel="stylesheet" href="nav.css">
    <link rel="stylesheet" href="chaorsp.css">
</head>

<body>

    <div id="section1" class="section">
        <div class="video-container">
            <video class="video" src="vd/2.mp4" controls width: 100%; height: 100%;></video>
        </div>

        <!-- 导航栏 -->
        <nav class="nav">
            <a href="index.html" class="nav-item">首页</a>
            <a href="jieshao.html" class="nav-item">介绍</a>
            <a href="zhanjiejs.html" class="nav-item">章节介绍</a>
            <a href="renwujs.html" class="nav-item">人物介绍</a>
            <a href="chaorpduan.html" class="nav-item">超燃片段</a>
        </nav>
    </div>




    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const sections = document.querySelectorAll('.section');

            window.addEventListener('scroll', function () {
                let current = '';
                sections.forEach(section => {
                    const sectionTop = section.offsetTop;
                    const sectionHeight = section.clientHeight;
                    if (window.pageYOffset >= (sectionTop - sectionHeight / 3)) {
                        current = section.getAttribute('id');
                    }
                });

                sections.forEach(section => {
                    section.style.backgroundColor = '';
                });

                if (current === 'section1') {
                    sections[0].style.backgroundColor = '#f00';
                } else if (current === 'section2') {
                    sections[1].style.backgroundColor = '#0f0';
                } else if (current === 'section3') {
                    sections[2].style.backgroundColor = '#00f';
                }
            });
        });
    </script>

</body>

</html>
